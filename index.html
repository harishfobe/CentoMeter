<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="application-name" content="CentoMeter"/><meta name="apple-mobile-web-app-title" content="CentoMeter"/><meta name="theme-color" content="#FFFFFF"/><meta name="description" content="CentoMeter — an interactive Indian real estate design prototype."/><title>CentoMeter — Find your place</title><link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin/><link rel="icon" type="image/svg+xml" href="/centometer-favicon.svg?v=2"/><script src="/config.js"></script>
</head><body>
<div id="root"><div id="preview-loading" role="status" style="min-height:90vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;color:#18181B;font:16px system-ui,sans-serif"><strong style="font-size:28px">CentoMeter</strong><p id="preview-loading-message">Opening your property preview…</p><button id="preview-reload" hidden style="border:0;border-radius:12px;background:#18181B;color:white;padding:14px 24px;font:inherit">Reload preview</button></div></div>
<script>
(() => {
  const showRetry = () => {
    const message = document.getElementById('preview-loading-message');
    const reload = document.getElementById('preview-reload');
    if (message && reload) {
      message.textContent = 'The preview could not finish loading. Check your connection and try again.';
      reload.hidden = false;
    }
  };
  document.getElementById('preview-reload').addEventListener('click', () => location.reload());
  window.addEventListener('error', showRetry);
  setTimeout(showRetry, 15000);
})();
</script>
<script type="module" src="/src/main.jsx"></script></body></html>
