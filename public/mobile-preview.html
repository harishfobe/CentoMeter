<!doctype html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <title>CentoMeter · Mobile preview</title>
 <script>
  // A nested iframe can intercept map touches and scrolling in mobile Safari.
  // Keep the framed device controls for desktop review, but use the app itself on phones.
  if (window.top === window.self && window.matchMedia('(pointer: coarse)').matches) {
   window.location.replace('/' + (window.location.hash || '#home'));
  }
 </script>
 <style>
  *{box-sizing:border-box}
  body{min-height:100dvh;margin:0;display:flex;flex-direction:column;background:#F4F4F5;color:#18181B;font:14px system-ui,sans-serif}
  header{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:12px 16px;flex-shrink:0}
  nav{display:flex;gap:5px}
  button,select{font:inherit;min-height:44px;cursor:pointer;border:1px solid #E4E4E7;background:white;color:#18181B;border-radius:8px;padding:8px 10px}
  button[aria-pressed=true]{background:#18181B;border-color:#18181B;color:white}
  button:focus-visible,select:focus-visible{outline:3px solid #18181B;outline-offset:2px}
  label{display:flex;align-items:center;gap:6px;font-size:13px}
  output{font-size:12px;color:#71717A;min-width:72px;text-align:center}
  main{flex:1;min-height:0;padding:4px 12px 24px;display:flex;justify-content:center}
  .phone{width:var(--phone-width,390px);max-width:100%;height:844px;overflow:hidden;border-radius:24px;box-shadow:0 8px 35px #18181B26;background:white}
  iframe{display:block;width:100%;height:100%;border:0;background:white}
  @media(max-width:480px){body{height:100dvh;overflow:hidden}header{display:none}main{padding:0}.phone{border-radius:0;box-shadow:none;width:100%;height:100%;max-height:none}}
 </style>
</head>
<body>
 <header><nav aria-label="Preview screen"><button type="button" data-route="home" aria-pressed="true">Browse</button><button type="button" data-route="property/p4" aria-pressed="false">Land</button><button type="button" data-route="map" aria-pressed="false">Map</button><button type="button" data-route="post" aria-pressed="false">Post</button></nav><label>Width<select id="phone-width" aria-label="Phone width"><option value="280">280 px</option><option value="320">320 px</option><option value="360">360 px</option><option value="375">375 px</option><option value="390" selected>390 px</option><option value="412">412 px</option><option value="430">430 px</option><option value="480">480 px</option></select></label><label>Text<select id="text-scale" aria-label="Text size"><option value="100">100%</option><option value="125">125%</option><option value="150">150%</option><option value="200">200%</option></select></label><output id="actual-size" aria-label="Actual viewport size"></output></header>
 <main><div class="phone" id="phone"><iframe id="mobile-app" title="CentoMeter mobile app" src="/#home"></iframe></div></main>
 <script>
  const frame=document.getElementById('mobile-app');
  const controls=document.querySelectorAll('button[data-route]');
  const width=document.getElementById('phone-width');
  const textScale=document.getElementById('text-scale');
  const applyTextSize=()=>{if(frame.contentDocument?.documentElement)frame.contentDocument.documentElement.style.fontSize=textScale.value+'%'};
  textScale.addEventListener('change',applyTextSize);
  frame.addEventListener('load',applyTextSize);
  new ResizeObserver(()=>{document.getElementById('actual-size').value=frame.clientWidth+' × '+frame.clientHeight}).observe(frame);
  width.addEventListener('change',()=>document.getElementById('phone').style.setProperty('--phone-width',width.value+'px'));
  controls.forEach(button=>button.addEventListener('click',()=>{
   controls.forEach(control=>control.setAttribute('aria-pressed',String(control===button)));
   frame.src='/#'+button.dataset.route;
  }));
 </script>
</body>
</html>
